kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: banvic

nodes:
  - role: control-plane
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256

    extraMounts:
      # Fontes CSV: imutaveis, somente leitura.
      - hostPath: /home/gabrielrsilva/projetos/banvic-data-platform/data/incoming
        containerPath: /data/incoming
        readOnly: true

      # DAGs: leitura e escrita, porque o dag-processor grava __pycache__.
      - hostPath: /home/gabrielrsilva/projetos/banvic-data-platform/airflow/dags
        containerPath: /data/dags
        readOnly: false

      # Logs: RWX entre os quatro componentes e os pods efemeros de task.
      # O provisionador local-path do Kind so suporta RWO, entao usamos
      # PV estatico via hostPath. Bonus: logs legiveis direto no host.
      - hostPath: /home/gabrielrsilva/projetos/banvic-data-platform/airflow/logs
        containerPath: /data/logs
        readOnly: false

    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30432
        hostPort: 15432
        protocol: TCP
