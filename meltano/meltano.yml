requires_meltano: ">=4.2.2"
default_environment: prod
project_id: banvic-data-platform

environments:
  - name: prod

plugins:
  extractors:
    - name: tap-csv
      variant: meltanolabs
      pip_url: git+https://github.com/MeltanoLabs/tap-csv.git@v1.3.2
      config:
        add_metadata_columns: true
        files:
          - entity: agencias
            path: /opt/banvic/incoming/agencias.csv
            keys: [cod_agencia]
          - entity: clientes
            path: /opt/banvic/incoming/clientes.csv
            keys: [cod_cliente]
          - entity: colaborador_agencia
            path: /opt/banvic/incoming/colaborador_agencia.csv
            keys: [cod_colaborador, cod_agencia]
          - entity: colaboradores
            path: /opt/banvic/incoming/colaboradores.csv
            keys: [cod_colaborador]
          - entity: contas
            path: /opt/banvic/incoming/contas.csv
            keys: [num_conta]
          - entity: propostas_credito
            path: /opt/banvic/incoming/propostas_credito.csv
            keys: [cod_proposta]
          - entity: transacoes
            path: /opt/banvic/incoming/transacoes.csv
            keys: [cod_transacao]

  loaders:
    - name: target-postgres
      variant: meltanolabs
      pip_url: meltanolabs-target-postgres==0.8.0
      config:
        default_target_schema: staging
        load_method: overwrite
        add_record_metadata: true
